name: CI/CD

on:
  pull_request:
    branches: [develop, hotfix, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, hotfix, main]

jobs:
  validate-branch-flow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request branch flow
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$BASE_REF:$HEAD_REF" in
            develop:feature/*|hotfix:fix/*|main:develop|main:hotfix)
              echo "Allowed branch flow: $HEAD_REF -> $BASE_REF"
              ;;
            *)
              echo "Invalid branch flow: $HEAD_REF -> $BASE_REF"
              echo "Allowed flows are feature/* -> develop, fix/* -> hotfix, develop -> main, and hotfix -> main."
              exit 1
              ;;
          esac

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
      - run: npm install -g pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm build

  preview:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/hotfix')
    needs: quality
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
      - run: npm install -g pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          CONTACT_TO_EMAIL: ${{ vars.CONTACT_TO_EMAIL }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
      - name: Deploy preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: versions upload
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Add preview URL to job summary
        run: |
          {
            echo "## 🚀 Preview URL"
            echo ""
            echo "\`${{ steps.preview.outputs.deployment-url }}\`"
            echo ""
            echo "**Branch:** \`${{ github.ref_name }}\`"
          } >> $GITHUB_STEP_SUMMARY

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
      - run: npm install -g pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          CONTACT_TO_EMAIL: ${{ vars.CONTACT_TO_EMAIL }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: deploy
